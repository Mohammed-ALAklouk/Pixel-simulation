name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # needed by the release job to upload assets

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # raylib / imgui / rlImGui / nlohmann_json are cloned by FetchContent into
      # .deps (see FETCHCONTENT_BASE_DIR in CMakeLists.txt). The key tracks the
      # top-level CMakeLists, which is where the GIT_TAGs live -- bumping a
      # dependency version invalidates the cache automatically.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # The ci-windows preset deliberately pins no generator, so CMake picks
      # whichever Visual Studio the runner image happens to ship. windows-latest
      # moved from VS 2022 to VS 2026 in June 2026 and broke a pinned `vs2022`
      # preset; auto-detection survives the next rollover too. The local vs2022 /
      # vs2026 presets are unaffected.
      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows-release

      - name: Test
        run: ctest --preset ci-windows

      # The build tree's assets/ is a junction back into the source tree, so it
      # is copied from the source directly rather than from the output folder.
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/Scree | Out-Null
          Copy-Item build/ci-windows/Game/Release/Scree.exe dist/Scree/
          Copy-Item Game/assets dist/Scree/assets -Recurse
          Copy-Item README.md, LICENSE dist/Scree/
          Compress-Archive -Path dist/Scree/* -DestinationPath dist/Scree-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Scree-windows-x64
          path: dist/Scree/

      # gh release create fails if a release for the tag already exists, which
      # breaks workflow re-runs. Create the release only when it is missing,
      # then upload (--clobber to overwrite the asset on a re-run).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (gh release view "$env:GITHUB_REF_NAME" 2>$null)) {
            gh release create "$env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload "$env:GITHUB_REF_NAME" dist/Scree-windows-x64.zip --clobber
